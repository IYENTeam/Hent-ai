name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev, release]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Session Kit (bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit/cli

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit -p .

      - name: Test
        run: bun test

  generate:
    name: Generate Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check if generate module exists
        id: check
        run: |
          if [ -f generate/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install shared dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: shared
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: generate
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: generate
        run: npm run build

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: generate
        run: npm test

      - name: Skip (module not present)
        if: steps.check.outputs.exists != 'true'
        run: echo "generate/ not present on this branch, skipping"

  service:
    name: Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  shared:
    name: Shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  integration:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [kit, generate, service, shared]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify session kit package
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('kit/cli/package.json', 'utf8'));
            if (Object.keys(pkg.dependencies || {}).length) { console.error('kit/cli must have no runtime dependencies'); process.exit(1); }
            if (!pkg.bin || pkg.bin.hent !== 'src/cli.ts') { console.error('kit/cli bin.hent must be src/cli.ts'); process.exit(1); }
            if (!fs.existsSync('kit/skill/hent-mode/SKILL.md')) { console.error('kit/skill/hent-mode/SKILL.md missing'); process.exit(1); }
            console.log('Session kit package valid');
          "

      - name: Verify assets integrity
        run: |
          ASSET_DIR="assets"
          if [ -d "$ASSET_DIR" ]; then
            COUNT=$(find "$ASSET_DIR" -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.webp" \) | wc -l)
            echo "✅ Found $COUNT image assets"
            if [ "$COUNT" -eq 0 ]; then
              echo "::warning::No image assets found in assets/"
            fi
          else
            echo "::error::assets/ directory missing"
            exit 1
          fi

  ci_required:
    name: CI Required
    runs-on: ubuntu-latest
    if: always()
    needs: [kit, generate, service, shared, integration]

    steps:
      - name: Require every CI lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs).filter(([, value]) => value.result !== "success");
          if (failed.length > 0) {
            console.error("Required CI jobs did not succeed:", failed);
            process.exit(1);
          }
          console.log("All required CI jobs succeeded.");
          NODE

  release_gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (
        (github.event_name == 'push' &&
          (github.ref_name == 'main' || github.ref_name == 'release')) ||
        (github.event_name == 'pull_request' &&
          (github.base_ref == 'main' || github.base_ref == 'release'))
      )
    needs: [ci_required]

    steps:
      - name: Require CI aggregate
        run: |
          if [ "${{ needs.ci_required.result }}" != "success" ]; then
            echo "CI Required did not succeed"
            exit 1
          fi
          echo "Release gate passed"
