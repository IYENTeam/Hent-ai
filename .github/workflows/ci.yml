name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev, release]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openclaw:
    name: OpenClaw Plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Strip OpenClaw SDK dependencies (not published to npm)
        run: node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          for (const section of ['devDependencies','peerDependencies','dependencies']) {
            if (!pkg[section]) continue;
            for (const [k,v] of Object.entries(pkg[section])) {
              if (k.startsWith('@openclaw/')) delete pkg[section][k];
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install shared dependencies
        working-directory: shared
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit --skipLibCheck

      - name: Test
        run: pnpm test

  generate:
    name: Generate Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check if generate module exists
        id: check
        run: |
          if [ -f generate/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install shared dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: shared
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: generate
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: generate
        run: npm run build

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: generate
        run: npm test

      - name: Skip (module not present)
        if: steps.check.outputs.exists != 'true'
        run: echo "generate/ not present on this branch, skipping"

  service:
    name: Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  shared:
    name: Shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  hermes:
    name: Hermes Plugin (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check if hermes module exists
        id: check
        run: |
          if [ -f hermes/__init__.py ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run hermes tests
        if: steps.check.outputs.exists == 'true'
        run: python -m unittest discover -s tests/hermes -p 'test_*.py' -v

      - name: Skip (module not present)
        if: steps.check.outputs.exists != 'true'
        run: echo "hermes/ not present, skipping"

  integration:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [openclaw, generate, service, shared, hermes]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify plugin manifest
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('openclaw/openclaw.plugin.json', 'utf8'));
            const required = ['id', 'name', 'description', 'activation', 'configSchema'];
            const missing = required.filter(k => !manifest[k]);
            if (missing.length) {
              console.error('Missing required manifest fields:', missing.join(', '));
              process.exit(1);
            }
            console.log('✅ Plugin manifest valid:', manifest.id, '—', manifest.name);

            // Validate configSchema is valid JSON Schema
            const schema = manifest.configSchema;
            if (schema.type !== 'object') {
              console.error('configSchema.type must be object');
              process.exit(1);
            }
            console.log('✅ Config schema properties:', Object.keys(schema.properties || {}).length);
          "

      - name: Verify assets integrity
        run: |
          ASSET_DIR="assets"
          if [ -d "$ASSET_DIR" ]; then
            COUNT=$(find "$ASSET_DIR" -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.webp" \) | wc -l)
            echo "✅ Found $COUNT image assets"
            if [ "$COUNT" -eq 0 ]; then
              echo "::warning::No image assets found in assets/"
            fi
          else
            echo "::error::assets/ directory missing"
            exit 1
          fi

      - name: Verify entry point exports
        run: |
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('openclaw/index.ts', 'utf8');
            if (!content.includes('definePluginEntry')) {
              console.error('index.ts must use definePluginEntry');
              process.exit(1);
            }
            console.log('✅ Entry point uses definePluginEntry');
          "

  ci_required:
    name: CI Required
    runs-on: ubuntu-latest
    if: always()
    needs: [openclaw, generate, service, shared, hermes, integration]

    steps:
      - name: Require every CI lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs).filter(([, value]) => value.result !== "success");
          if (failed.length > 0) {
            console.error("Required CI jobs did not succeed:", failed);
            process.exit(1);
          }
          console.log("All required CI jobs succeeded.");
          NODE

  release_gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (
        (github.event_name == 'push' &&
          (github.ref_name == 'main' || github.ref_name == 'release')) ||
        (github.event_name == 'pull_request' &&
          (github.base_ref == 'main' || github.base_ref == 'release'))
      )
    needs: [ci_required]

    steps:
      - name: Require CI aggregate
        run: |
          if [ "${{ needs.ci_required.result }}" != "success" ]; then
            echo "CI Required did not succeed"
            exit 1
          fi
          echo "Release gate passed"
